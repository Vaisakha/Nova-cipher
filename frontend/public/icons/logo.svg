<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F4B7C"/>
      <stop offset="100%" stop-color="#142032"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="url(#astroGrad)"/>
  
  <!-- Orbital Ring -->
  <ellipse cx="256" cy="256" rx="190" ry="85" fill="none" stroke="#A9CBEF" stroke-width="10" stroke-dasharray="16 10" transform="rotate(-30 256 256)" opacity="0.8"/>
  
  <!-- Outer Shield -->
  <path d="M256 80 L390 140 V260 C390 350 256 420 256 420 C256 420 122 350 122 260 V140 Z" fill="none" stroke="#CFE3F7" stroke-width="14" stroke-linejoin="round"/>
  
  <!-- Pulse / Vitals Line -->
  <path d="M150 260 H205 L225 210 L250 310 L275 180 L300 290 L315 260 H362" fill="none" stroke="#2EC48B" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Mission Star / Celestial Marker -->
  <polygon points="256,110 264,130 286,130 268,144 275,165 256,152 237,165 244,144 226,130 248,130" fill="#FFCC00"/>
</svg>
